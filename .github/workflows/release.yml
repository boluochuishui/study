name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-build:
    name: Verify and build release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version"
            exit 1
          fi

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mvn --batch-mode --no-transfer-progress versions:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Run tests and quality checks
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload Jar and quality reports
        uses: actions/upload-artifact@v7
        with:
          name: study-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/study-${{ inputs.version }}.jar
            target/surefire-reports/
            target/checkstyle-*.xml
            target/spotbugsXml.xml
            target/site/jacoco/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: study:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
