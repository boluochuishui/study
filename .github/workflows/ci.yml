name: Continuous Integration

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-quality:
    name: Console lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: study-console-web
    env:
      VITE_ENABLE_MOCK: "false"
      VITE_APP_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: study-console-web/package-lock.json
      - name: Install console dependencies
        run: npm ci
      - name: Verify console
        run: |
          npm run lint
          npm run test
          npm run build

  quality-gate:
    name: Test and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and quality checks
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/
            **/target/checkstyle-*.xml
            **/target/spotbugsXml.xml
            **/target/site/jacoco/
