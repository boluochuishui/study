server:
  port: ${ADMIN_PORT:8081}

spring:
  config:
    import: classpath:service-lifecycle.yaml
  application:
    name: study-admin
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:content_risk}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

admin:
  online-test:
    access-url: ${ONLINE_TEST_ACCESS_URL:http://localhost:8080}
    credentials:
      default:
        app-id: ${ONLINE_TEST_APP_ID:demo-app}
        secret: ${ONLINE_TEST_APP_SECRET:demo-secret}
  logs:
    elasticsearch:
      url: ${LOG_ES_URL:}
      api-key: ${LOG_ES_API_KEY:}
      data-stream: ${LOG_ES_DATA_STREAM:logs-contentrisk-*}
  security:
    token-ttl-hours: ${ADMIN_TOKEN_TTL_HOURS:8}
  bootstrap:
    tenant-code: ${ADMIN_BOOTSTRAP_TENANT:default}
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
