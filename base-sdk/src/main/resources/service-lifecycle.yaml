# 各服务通过 spring.config.import 引入通用上下线参数。
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:45s}
base-sdk:
  logs:
    structured:
      enabled: ${LOG_STRUCTURED_ENABLED:false}
    tenant-id: ${LOG_TENANT_ID:0}
  detection-files:
    root: ${DETECT_FILE_ROOT:${java.io.tmpdir}/study-detect-files}
    retention: ${DETECT_FILE_RETENTION:24h}
  lifecycle:
    drain-timeout: ${SERVICE_DRAIN_TIMEOUT:40s}
    drain-token: ${SERVICE_DRAIN_TOKEN:}

study:
  worker:
    # 请求总预算为软截止时间，单节点仍由责任链自身的超时机制管理。
    request-timeout-ms: ${DETECT_REQUEST_TIMEOUT_MS:25000}
