apiVersion: v1
kind: ConfigMap
metadata:
  name: content-risk-config
  namespace: content-risk
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: content_risk
  MYSQL_USERNAME: root
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  NACOS_ADDRESS: N/A
  DETECT_MESSAGING_MODE: logging
  DETECT_FILE_ROOT: /data/detection-files
  DETECT_FILE_RETENTION: 24h
  SPEL_RULE_HOTLOAD_ENABLED: "false"
  TEXT_LARGE_MODEL_ENABLED: "false"
  HOTLOAD_POLL_INTERVAL_MS: "30000"
  LOG_STRUCTURED_ENABLED: "true"
  LOG_TENANT_ID: "1"
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=20.0
