apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-service
  namespace: content-risk
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: access-service
  template:
    metadata:
      labels:
        app: access-service
    spec:
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql --silent; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: application
          image: content-risk/access-service:local
          imagePullPolicy: Never
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    wget -q -T 5 -O -
                    --header="X-Drain-Token: $SERVICE_DRAIN_TOKEN"
                    --post-data='' http://127.0.0.1:8080/internal/lifecycle/drain;
                    sleep 5
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: content-risk-config
          env:
            - name: SERVICE_DRAIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: content-risk-local-secret
                  key: SERVICE_DRAIN_TOKEN
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: content-risk-local-secret
                  key: MYSQL_PASSWORD
            - name: AUTH_APP_ID
              valueFrom:
                secretKeyRef:
                  name: content-risk-local-secret
                  key: AUTH_APP_ID
            - name: AUTH_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: content-risk-local-secret
                  key: AUTH_APP_SECRET
            - name: MYSQL_MIGRATION_ENABLED
              value: "true"
            - name: TEXT_DETECT_RPC_URL
              value: tri://text-detect-service:50051
            - name: IMAGE_DETECT_RPC_URL
              value: tri://image-detect-service:50052
            - name: AUDIO_DETECT_RPC_URL
              value: tri://audio-detect-service:50053
            - name: VIDEO_DETECT_RPC_URL
              value: tri://video-detect-service:50054
          startupProbe:
            httpGet:
              path: /internal/lifecycle/ready
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /internal/lifecycle/ready
              port: 8080
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /internal/lifecycle/live
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: access-service
  namespace: content-risk
spec:
  type: NodePort
  selector:
    app: access-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
