apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-detect-service
  namespace: content-risk
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: text-detect-service
  template:
    metadata:
      labels:
        app: text-detect-service
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: application
          image: content-risk/text-detect-service:local
          imagePullPolicy: Never
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    wget -q -T 5 -O -
                    --header="X-Drain-Token: $SERVICE_DRAIN_TOKEN"
                    --post-data='' http://127.0.0.1:8080/internal/lifecycle/drain;
                    sleep 5
          ports:
            - name: lifecycle
              containerPort: 8080
            - name: rpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: content-risk-config
          env:
            - name: SERVICE_DRAIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: content-risk-local-secret
                  key: SERVICE_DRAIN_TOKEN
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: content-risk-local-secret
                  key: MYSQL_PASSWORD
          startupProbe:
            httpGet:
              path: /internal/lifecycle/ready
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /internal/lifecycle/ready
              port: 8080
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /internal/lifecycle/live
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: "1"
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: text-detect-service
  namespace: content-risk
spec:
  selector:
    app: text-detect-service
  ports:
    - name: rpc
      port: 50051
      targetPort: rpc
---
