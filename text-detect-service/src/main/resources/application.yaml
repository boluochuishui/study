spring:
  config:
    import: classpath:service-lifecycle.yaml
  application:
    name: text-detect-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:content_risk}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}

dubbo:
  application:
    name: text-detect-service
    qos-enable: false
  protocol:
    name: tri
    port: ${DUBBO_PORT:50051}
  registry:
    address: ${NACOS_ADDRESS:N/A}
  provider:
    timeout: ${DUBBO_PROVIDER_TIMEOUT_MS:5000}

study:
  worker:
    messaging:
      mode: ${DETECT_MESSAGING_MODE:logging}
    kafka:
      task-topic: ${DETECT_TASK_TOPIC:detect-task-text}
      consumer-group: ${DETECT_CONSUMER_GROUP:text-detect-consumer}
      result-topic: ${DETECT_RESULT_TOPIC:detect-result}
      publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:3s}

detect:
  text:
    violation-cache:
      enabled: ${TEXT_VIOLATION_CACHE_ENABLED:true}
      key-prefix: ${TEXT_VIOLATION_CACHE_KEY_PREFIX:study:risk:text}
      decision-version: ${TEXT_DECISION_VERSION:v1}
      ttl: ${TEXT_VIOLATION_CACHE_TTL:7d}
    large-model:
      enabled: ${TEXT_LARGE_MODEL_ENABLED:false}
  rules:
    spel:
      enabled: ${SPEL_RULE_HOTLOAD_ENABLED:false}
      tenant-id: ${DETECT_TENANT_ID:1}
      scene: TEXT

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
